<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Smart Home - Dashboard</title>
  
  <!-- Favicon Logo cho Tab Trình duyệt -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chart.js for live sensor charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar Navigation -->
  <div class="sidebar">
    <h2>🏠 SmartHome IoT</h2>
    <a class="active" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-house"></i> Overview</a>
    <a onclick="switchTab('sensors', this)"><i class="fa-solid fa-chart-line"></i> Sensor Charts</a>
    <a onclick="switchTab('logs', this)"><i class="fa-solid fa-clock-rotate-left"></i> Activity Logs</a>
  </div>

  <!-- Main Content Area -->
  <div class="main-content">
    <header>
      <h1>Smart Home Control Dashboard</h1>
      <div class="header-right">
        <!-- Nút chuyển Dark/Light Mode -->
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
          <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
        <span class="badge" id="systemStatus">● System: Online</span>
      </div>
    </header>

    <!-- TAB 1: OVERVIEW -->
    <div id="dashboard" class="tab-pane active">
      <div class="grid">
        <div class="card">
          <i class="fa-solid fa-lightbulb" id="iconLight"></i>
          <h3>Living Room Light</h3>
          <label class="switch">
            <input type="checkbox" id="lightSwitch" onchange="toggleDevice('Living Room Light', this.checked, 'lightStatus', 'iconLight')">
            <span class="slider"></span>
          </label>
          <div id="lightStatus" class="status-text">Turned OFF</div>
        </div>

        <div class="card">
          <i class="fa-solid fa-fan" id="iconFan"></i>
          <h3>Ventilation Fan</h3>
          <label class="switch">
            <input type="checkbox" id="fanSwitch" onchange="toggleDevice('Ventilation Fan', this.checked, 'fanStatus', 'iconFan')">
            <span class="slider"></span>
          </label>
          <div id="fanStatus" class="status-text">Turned OFF</div>
        </div>

        <!-- Thẻ nhiệt độ tự động đổi màu cảnh báo khi quá nhiệt -->
        <div class="card" id="tempCard">
          <i class="fa-solid fa-temperature-half"></i>
          <h3>Room Temperature</h3>
          <div class="sensor-val"><span id="tempVal">28.5</span>°C</div>
        </div>

        <div class="card">
          <i class="fa-solid fa-droplet"></i>
          <h3>Air Humidity</h3>
          <div class="sensor-val"><span id="humiVal">65</span>%</div>
        </div>
      </div>
    </div>

    <!-- TAB 2: SENSOR CHARTS -->
    <div id="sensors" class="tab-pane">
      <div class="chart-box">
        <h3>Real-time Temperature & Humidity Variance</h3>
        <canvas id="myChart" width="400" height="150"></canvas>
      </div>
    </div>

    <!-- TAB 3: ACTIVITY LOGS -->
    <div id="logs" class="tab-pane">
      <div class="logs-container">
        <h3>User Action History</h3>
        <ul id="logList"></ul>
      </div>
    </div>
  </div>

  <!-- Custom JavaScript -->
  <script src="script.js"></script>
</body>
</html>
